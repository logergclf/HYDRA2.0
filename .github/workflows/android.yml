name: Compilar APK de HYDRA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Obtener código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 (JDK)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generar ejecutable de Gradle Wrapper
      run: gradle wrapper --gradle-version 8.2

    - name: Dar permisos de ejecución
      run: chmod +x gradlew

    - name: Compilar APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Subir el APK generado como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: HYDRA-Core-v1.0.apk
        path: app/build/outputs/apk/debug/app-debug.apk
